[package]
edition = "2021"
name = "slacc"
version = "0.2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
aho-corasick = "1.1.4"
aws-lc-rs = { version = "1.16.3", default-features = false, features = [
  "alloc",
  "aws-lc-sys",
  "prebuilt-nasm",
  "ring-io",
  "ring-sig-verify",
  "unstable",
] }
napi = { version = "3.8.5", default-features = false, features = ["napi10"] }
napi-derive = "3.5.4"
pkcs8 = { version = "0.10.2", default-features = false, features = [
  "alloc",
  "pem",
  "std",
] }
rayon = "1.12.0"
spki = { version = "0.8.0", default-features = false, features = [
  "alloc",
  "digest",
  "fingerprint",
  "pem",
  "std",
] }
zip = "8.5.1"

[build-dependencies]
napi-build = "2.3.1"

[profile.release]
lto = true
